<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preferências - Agregador de Notícias</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="/home">📰 Home</a>
    <a href="/personalizacao" class="active">⚙️ Preferências</a>
    <a href="/favoritos">❤️ Favoritos</a>
    <a href="/estatisticas">📊 Estatísticas</a>
  </div>
  <div class="nav-right">
    <a href="/ajuda">❓ Ajuda</a>
    <a href="/logout">🚪 Logout</a>
  </div>
</nav>

<div class="page-container">
  <h2>⚙️ Personalizar Categorias</h2>
  <p>Selecione as categorias que deseja acompanhar</p>

  <form method="POST" action="/personalizacao" class="preferences-form">
    <h3>Categorias Disponíveis</h3>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="categorias" value="general"> 📰 Geral
      </label>
    </div>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="categorias" value="technology"> 💻 Tecnologia
      </label>
    </div>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="categorias" value="sports"> ⚽ Desporto
      </label>
    </div>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="categorias" value="health"> 🏥 Saúde
      </label>
    </div>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="categorias" value="science"> 🔬 Ciência
      </label>
    </div>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="categorias" value="business"> 💼 Negócios
      </label>
    </div>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="categorias" value="entertainment"> 🎬 Entretenimento
      </label>
    </div>

    <button type="submit" class="save-button">💾 Salvar Preferências</button>

  </form>
</div>

<a href="/ajuda" class="help-badge" title="Central de Ajuda">❓</a>

</body>
</html>
